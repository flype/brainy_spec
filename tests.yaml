# -- Summary Generation -------------------------------------------------------
SummaryGeneration:
  # DURABLE -- YouTube summary format
  - name: "boundary - YouTube summary contains timestamps in MM:SS or HH:MM:SS format"
    durability: durable
    input: { content_type: "youtube", content: "video transcript with multiple topics" }
    output: { contains_timestamp_pattern: "(\\d{1,2}:\\d{2}:\\d{2}|\\d{1,2}:\\d{2})", timestamp_count_gte: 1 }

  - name: "boundary - YouTube summary starts with title (no preamble)"
    durability: durable
    input: { content_type: "youtube", content: "video transcript" }
    output: { does_not_start_with: ["Here is", "Of course", "Sure", "I've created", "Below is"] }

  - name: "boundary - YouTube summary has descriptive section titles after timestamps"
    durability: durable
    input: { content_type: "youtube", content: "video transcript with topic changes" }
    output: { contains_pattern: "(\\d{1,2}:\\d{2}:\\d{2}|\\d{1,2}:\\d{2})\\s*[-–]?\\s*.{10,}" }

  - name: "boundary - YouTube summary timestamps are chronologically ordered"
    durability: durable
    input: { content_type: "youtube", content: "long video transcript" }
    output: { timestamps_chronologically_ordered: true }

  - name: "boundary - YouTube summary includes introductory paragraph after title"
    durability: durable
    input: { content_type: "youtube", content: "video transcript about a specific topic" }
    output: { has_intro_paragraph_before_first_timestamp: true, intro_paragraph_min_length: 50 }

  - name: "boundary - YouTube summary sections have rich descriptions (not just bullets)"
    durability: durable
    input: { content_type: "youtube", content: "detailed video transcript" }
    output: { avg_section_description_length_gte: 50 }
    note: "Each section should have at least 2-5 sentences of description, not just one-line bullet points"

  - name: "boundary - YouTube summary language matches content language"
    durability: durable
    input: { content_type: "youtube", content: "transcripción de video en español sobre tecnología" }
    output: { summary_language: "es" }

  - name: "boundary - long YouTube video uses HH:MM:SS timestamps"
    durability: durable
    input: { content_type: "youtube", content: "transcript of 1h30m video", video_duration_seconds: 5400 }
    output: { contains_timestamp_pattern: "\\d{1,2}:\\d{2}:\\d{2}" }

  # DURABLE -- Article summary format
  - name: "boundary - article summary has 5 numbered sections"
    durability: durable
    input: { content_type: "webpage", content: "long article about technology" }
    output: { contains_sections: ["1. **Main Topic**", "2. **Key Points**", "3. **Important Details**", "4. **Conclusions**", "5. **Relevance**"] }

  - name: "boundary - article summary starts with Main Topic section (no preamble)"
    durability: durable
    input: { content_type: "webpage", content: "article content" }
    output: { starts_with: "1. **Main Topic**", does_not_start_with: ["Here is", "Of course", "Sure", "I've created", "Below is"] }

  - name: "boundary - article Key Points section has 3-5 bullet items"
    durability: durable
    input: { content_type: "webpage", content: "detailed article" }
    output: { key_points_bullet_count_gte: 3, key_points_bullet_count_lte: 5 }

  # DURABLE -- Social media summary format
  - name: "boundary - twitter summary is 2-3 paragraphs max"
    durability: durable
    input: { content_type: "twitter", content: "tweet thread content" }
    output: { paragraph_count_lte: 3, paragraph_count_gte: 1 }

  - name: "boundary - tiktok summary is 2-3 paragraphs max"
    durability: durable
    input: { content_type: "tiktok", content: "tiktok video description" }
    output: { paragraph_count_lte: 3, paragraph_count_gte: 1 }

  - name: "boundary - social media summary starts directly (no preamble)"
    durability: durable
    input: { content_type: "twitter", content: "tweet content" }
    output: { does_not_start_with: ["Here is", "Of course", "Sure", "I've created", "Below is"] }

  # DURABLE -- General behavioral rules
  - name: "boundary - summary generation failure does not block bookmark creation"
    durability: durable
    input: { content_type: "webpage", content: "article", summary_generation_fails: true }
    output: { bookmark_created: true, summary: null }

  - name: "boundary - re-extraction preserves existing summary on failure"
    durability: durable
    input: { id: "bookmark-with-summary", summary_generation_fails: true }
    precondition: "bookmark has summary='Existing summary text'"
    output: { summary: "Existing summary text" }

  - name: "boundary - content type routing uses URL detection"
    durability: durable
    input: { url: "https://www.youtube.com/watch?v=abc123", content: "transcript" }
    output: { summary_format: "youtube_timestamped" }

  - name: "boundary - content type routing for webpage"
    durability: durable
    input: { url: "https://example.com/article", content: "article text" }
    output: { summary_format: "article_5_section" }

  # DURABLE -- Token limits per content type and provider
  - name: "boundary - YouTube summary max tokens is 4000 (OpenAI) or 8000 (Gemini)"
    durability: durable
    input: { content_type: "youtube" }
    output: { max_tokens_openai: 4000, max_tokens_gemini: 8000 }

  - name: "boundary - social media summary max tokens is 1000"
    durability: durable
    input: { content_type: "twitter" }
    output: { max_tokens: 1000 }

  - name: "boundary - article summary max tokens is 2000 (OpenAI) or 8000 (Gemini)"
    durability: durable
    input: { content_type: "webpage" }
    output: { max_tokens_openai: 2000, max_tokens_gemini: 8000 }

  # EPHEMERAL -- Format examples
  - name: "example - YouTube summary includes speaker attributions"
    durability: ephemeral
    input: { content_type: "youtube", content: "transcript with multiple speakers" }
    output: { contains_speaker_attribution: true }

  - name: "example - YouTube summary has specific details from transcript (no hallucination)"
    durability: ephemeral
    input: { content_type: "youtube", content: "transcript mentioning specific names, numbers, and examples" }
    output: { summary_contains_specific_details_from_input: true }
    note: "Summary MUST reference actual entities from the transcript, not generic/hallucinated content"

  - name: "example - YouTube summary sections are standalone summaries"
    durability: ephemeral
    input: { content_type: "youtube", content: "90-minute podcast transcript" }
    output: { each_section_has_paragraph_description: true, each_section_min_sentences: 2 }
    note: "Each timestamped section should have enough detail for someone to understand the topic without watching"

  - name: "example - Spanish YouTube video produces Spanish summary"
    durability: ephemeral
    input: { content_type: "youtube", content: "transcripción de un podcast sobre startups SaaS en restauración" }
    output: { summary_language: "es", contains_intro_paragraph: true, timestamps_present: true }

  - name: "example - article summary preserves technical details"
    durability: ephemeral
    input: { content_type: "webpage", content: "article about React 19 with code examples" }
    output: { summary_contains_technical_terms: true }

  - name: "example - default content type uses generic summary format"
    durability: ephemeral
    input: { content_type: "unknown", content: "generic content" }
    output: { does_not_start_with: ["Here is", "Of course", "Sure"] }

