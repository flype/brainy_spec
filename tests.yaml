# -- Ask View -----------------------------------------------------------------
AskView:
  # DURABLE -- Streaming behavior
  - name: "boundary - question input auto-focuses on view switch"
    durability: durable
    input: { action: "switch to ask view" }
    output: { question_input_focused: true }

  - name: "boundary - submit disabled while streaming"
    durability: durable
    input: { action: "submit question while answer is streaming" }
    output: { submit_button_disabled: true }

  - name: "boundary - answer renders as markdown"
    durability: durable
    input: { answer_text: "# Hello\n\n**bold** text" }
    output: { rendered_html_contains: "<h1>Hello</h1>", rendered_html_contains_2: "<strong>bold</strong>" }

  - name: "boundary - citation click scrolls to citation card"
    durability: durable
    input: { action: "click [1] superscript in answer" }
    output: { citation_card_1_scrolled_into_view: true, citation_card_1_has_ring_highlight: true }

  - name: "boundary - ring highlight disappears after 2 seconds"
    durability: durable
    input: { action: "click [1] superscript in answer" }
    output: { ring_highlight_removed_after_2s: true }

  - name: "boundary - question saved to history (max 10)"
    durability: durable
    input: { action: "submit 12 different questions" }
    output: { history_length: 10, oldest_2_questions_dropped: true }

  - name: "boundary - question history persists across sessions"
    durability: durable
    input: { action: "submit question, reload page" }
    output: { history_contains_previous_question: true }

  # DURABLE -- KG highlighting
  - name: "boundary - KG highlights applied after streaming completes"
    durability: durable
    input: { answer_contains_known_term: "React" }
