# -- Citation Number Extraction -----------------------------------------------
extractCitedNumbers:
  # DURABLE -- Core extraction behavior
  - name: "boundary - extracts single citation"
    durability: durable
    input: { text: "This is relevant [1] to our discussion" }
    output: [1]

  - name: "boundary - extracts multiple citations in order"
    durability: durable
    input: { text: "According to [2] and [1], the approach in [3] is best" }
    output: [2, 1, 3]

  - name: "boundary - deduplicates repeated citations"
    durability: durable
    input: { text: "As noted in [1], and confirmed by [2], again [1] agrees" }
    output: [1, 2]

  - name: "boundary - no citations returns empty array"
    durability: durable
    input: { text: "This text has no citations at all" }
    output: []

  - name: "boundary - empty text returns empty array"
    durability: durable
    input: { text: "" }
    output: []

  # DURABLE -- Edge cases
  - name: "boundary - does not extract non-numeric brackets"
    durability: durable
    input: { text: "Using [array] notation and [N] placeholder" }
    output: []

  - name: "boundary - extracts multi-digit citation numbers"
    durability: durable
    input: { text: "Sources [12] and [3] confirm this" }
    output: [12, 3]

  # EPHEMERAL -- Complex text
  - name: "example - citations in markdown with other brackets"
    durability: ephemeral
    input: { text: "The code `arr[0]` shows [1] and the map `m[key]` relates to [2]" }
    output: [1, 2]
    note: "arr[0] contains a digit but is part of code context - regex still matches [0] as a citation"

# -- Answer Formatting (Citation Transformation) ------------------------------
formatAnswer:
  # DURABLE -- Markdown rendering
  - name: "boundary - renders markdown headers to HTML"
    durability: durable
    input: { answer: "# Title\n\nSome text" }
    output: { html_contains: "<h1>", html_contains_2: "Title" }

  - name: "boundary - renders markdown bold to HTML"
    durability: durable
    input: { answer: "This is **bold** text" }
    output: { html_contains: "<strong>bold</strong>" }

  - name: "boundary - renders markdown code blocks"
    durability: durable
    input: { answer: "```javascript\nconst x = 1;\n```" }
    output: { html_contains: "<pre>", html_contains_code: "<code" }

  - name: "boundary - renders markdown tables"
    durability: durable
    input: { answer: "| Col1 | Col2 |\n|------|------|\n| A | B |" }
    output: { html_contains: "<table>", html_contains_td: "<td>" }

  # DURABLE -- Citation transformation
  - name: "boundary - transforms [1] into clickable superscript"
    durability: durable
    input: { answer: "This is important [1]." }
    output: { html_contains_sup: true, html_contains_citation_link: "#citation-1", no_raw_bracket_1: true }

  - name: "boundary - transforms multiple citations"
    durability: durable
    input: { answer: "See [1] and [2] for details." }
    output: { sup_count: 2, citation_link_targets: ["#citation-1", "#citation-2"] }

  - name: "boundary - citation click triggers scroll and ring"
    durability: durable
    input: { answer: "Reference [1]" }
    output: { onclick_contains_scrollIntoView: true, onclick_contains_ring_2: true, onclick_contains_setTimeout_2000: true }

  - name: "boundary - wraps output in div"
    durability: durable
    input: { answer: "Simple text" }
    output: { starts_with: "<div>", ends_with: "</div>" }

  # DURABLE -- Error handling
  - name: "boundary - empty answer returns empty string"
    durability: durable
    input: { answer: "" }
    output: ""

  - name: "boundary - null answer returns empty string"
    durability: durable
    input: { answer: null }
    output: ""

  - name: "boundary - malformed markdown falls back to escaped text"
    durability: durable
    input: { answer: "<script>alert('xss')</script>" }
    output: { does_not_contain_script_tag: true }
    note: "marked.js with sanitize:false will pass through HTML, but the fallback path escapes HTML"

  # EPHEMERAL -- Complex formatting
  - name: "example - markdown with GFM features"
    durability: ephemeral
    input: { answer: "- [x] Task done\n- [ ] Task pending\n\n~~strikethrough~~" }
    output: { html_contains_checkbox: true }

  - name: "example - line breaks with breaks:true"
    durability: ephemeral
    input: { answer: "Line 1\nLine 2" }
    output: { html_contains: "<br>" }

# -- Knowledge Graph Highlighting ---------------------------------------------
highlightTextNodes:
  # DURABLE -- Element exclusion
  - name: "boundary - does not highlight inside code elements"
    durability: durable
    input: { html: "<p>React is great</p><code>React.render()</code>", terms: [{ name: "React", type: "entity" }] }
    output: { highlight_count: 1, highlight_in_p: true, no_highlight_in_code: true }

  - name: "boundary - does not highlight inside pre elements"
    durability: durable
    input: { html: "<p>React hooks</p><pre>import React from 'react'</pre>", terms: [{ name: "React", type: "entity" }] }
    output: { highlight_count: 1, no_highlight_in_pre: true }

  - name: "boundary - does not highlight inside sup elements (citations)"
    durability: durable
    input: { html: "<p>React [1]</p><sup><a>[1]</a></sup>", terms: [{ name: "React", type: "entity" }] }
    output: { highlight_in_p: true, no_highlight_in_sup: true }

  - name: "boundary - does not highlight inside script or style"
    durability: durable
    input: { html: "<p>React</p><script>var React = require('react')</script><style>.React{}</style>", terms: [{ name: "React", type: "entity" }] }
    output: { highlight_count: 1 }

  - name: "boundary - does not highlight already-highlighted spans"
    durability: durable
    input: { html: "<p><span class='kg-highlight'>React</span> and React</p>", terms: [{ name: "React", type: "entity" }] }
    output: { total_highlight_spans: 2, new_highlights_added: 1 }
    note: "Idempotency: re-running highlighting on already-highlighted content does not double-wrap"

  # DURABLE -- Overlap resolution
  - name: "boundary - longer match wins over shorter overlap"
    durability: durable
    input: { html: "<p>Machine Learning is fascinating</p>", terms: [{ name: "Machine Learning", type: "concept" }, { name: "Machine", type: "entity" }] }
    output: { highlight_count: 1, highlighted_text: "Machine Learning", highlight_type: "concept" }

  - name: "boundary - entity priority wins over concept at same length"
    durability: durable
    input: { html: "<p>React patterns</p>", terms: [{ name: "React", type: "entity" }, { name: "React", type: "concept" }] }
    output: { highlight_count: 1, highlight_type: "entity" }
    note: "Entity priority (3) > Concept priority (2) > Category priority (1)"

  - name: "boundary - non-overlapping terms both highlighted"
    durability: durable
    input: { html: "<p>React and Kubernetes are popular</p>", terms: [{ name: "React", type: "entity" }, { name: "Kubernetes", type: "entity" }] }
    output: { highlight_count: 2 }

  # DURABLE -- Color mapping
  - name: "boundary - category terms get blue highlighting"
    durability: durable
    input: { html: "<p>Technology is a broad category</p>", terms: [{ name: "Technology", type: "category" }] }
    output: { highlight_class_contains: "kg-category", highlight_class_contains_2: "bg-blue-100", highlight_class_contains_3: "text-blue-700" }

  - name: "boundary - concept terms get green highlighting"
    durability: durable
    input: { html: "<p>Microservices architecture</p>", terms: [{ name: "Microservices", type: "concept" }] }
    output: { highlight_class_contains: "kg-concept", highlight_class_contains_2: "bg-green-100", highlight_class_contains_3: "text-green-700" }

  - name: "boundary - entity terms get orange highlighting"
    durability: durable
    input: { html: "<p>Kubernetes deployment</p>", terms: [{ name: "Kubernetes", type: "entity" }] }
    output: { highlight_class_contains: "kg-entity", highlight_class_contains_2: "bg-orange-100", highlight_class_contains_3: "text-orange-700" }

  # DURABLE -- Accessibility
  - name: "boundary - highlight spans have role=button"
    durability: durable
    input: { html: "<p>React</p>", terms: [{ name: "React", type: "entity" }] }
    output: { span_has_role_button: true, span_has_tabindex_0: true }

  - name: "boundary - highlight spans have aria-label with type and count"
    durability: durable
    input: { html: "<p>React</p>", terms: [{ name: "React", type: "entity", count: 5 }] }
    output: { aria_label_contains: "entity", aria_label_contains_2: "React" }

  - name: "boundary - highlight spans have aria-expanded=false initially"
    durability: durable
    input: { html: "<p>React</p>", terms: [{ name: "React", type: "entity" }] }
    output: { aria_expanded: "false" }

  # DURABLE -- Term filtering
  - name: "boundary - terms shorter than 3 chars are excluded"
    durability: durable
    input: { html: "<p>AI and ML are popular</p>", terms: [{ name: "AI", type: "concept" }, { name: "ML", type: "concept" }] }
    output: { highlight_count: 0 }

  - name: "boundary - terms longer than 50 chars are excluded"
    durability: durable
    input: { html: "<p>Very long term that exceeds the maximum character limit for highlighting</p>", terms: [{ name: "Very long term that exceeds the maximum character limit for highlighting", type: "concept" }] }
    output: { highlight_count: 0 }

  # DURABLE -- Word boundary matching
  - name: "boundary - matches whole words only"
    durability: durable
    input: { html: "<p>Reactive programming uses React</p>", terms: [{ name: "React", type: "entity" }] }
    output: { highlight_count: 1, highlighted_text: "React" }
    note: "'Reactive' should not be highlighted, only the standalone 'React'"

  # EPHEMERAL -- Edge cases
  - name: "example - empty terms array produces no highlights"
    durability: ephemeral
    input: { html: "<p>Some text about technology</p>", terms: [] }
    output: { highlight_count: 0 }

  - name: "example - text without matching terms produces no highlights"
    durability: ephemeral
    input: { html: "<p>Hello world</p>", terms: [{ name: "React", type: "entity" }] }
    output: { highlight_count: 0 }

