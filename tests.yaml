# =============================================================================
# WEB UI INVARIANTS -- Properties that must hold in the UI layer
# =============================================================================
ui_invariants:
  - name: "ui invariant - bookmarks ordered by date descending (no search)"
    after: [loadBookmarks]
    property: "when search query is empty, bookmarks are displayed grouped by date with newest date group first"

  - name: "ui invariant - bookmarks ordered by relevance (with search)"
    after: [loadBookmarks]
    property: "when search query is non-empty, bookmarks are ordered by relevance score descending"

  - name: "ui invariant - processing placeholder visible during job processing"
    after: [addBookmark]
    property: "a processing placeholder card is visible in the bookmark list from the moment POST /add returns 202 until the job reaches completed or failed status"

  - name: "ui invariant - citations match answer references"
    after: [askQuestion]
    property: "every citation card number corresponds to a [N] reference in the rendered answer text, and no citation card exists without a corresponding reference"

  - name: "ui invariant - notification auto-dismisses after 5 seconds"
    after: [showNotification]
    property: "notification toast is removed from the DOM within 5500ms of appearing"

  - name: "ui invariant - KG highlights skip code elements"
    after: [forceHighlight]
    property: "no <span class='kg-highlight'> elements exist inside <code>, <pre>, <script>, <style>, or <sup> elements"

  - name: "ui invariant - autocomplete closes on blur"
    after: [blur_search_input]
    property: "autocomplete dropdown is hidden within 200ms of search input blur event"

