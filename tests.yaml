    output: { enqueued: true, blocking: false }

  - name: "boundary - full queue rejects job"
    durability: durable
    input: { job: "valid job" }
    precondition: "queue buffer is full (100 items)"
    output: { error: "queue full" }

  # DURABLE -- Retry behavior
  - name: "boundary - retryable error gets retried"
    durability: durable
    input: { job: "job that fails with HTTP 500" }
    output: { retry_count: 3, final_status: "failed" }

  - name: "boundary - non-retryable error fails immediately"
    durability: durable
    input: { job: "job with invalid URL" }
    output: { retry_count: 0, final_status: "failed", error_contains: "invalid URL" }

  - name: "boundary - exponential backoff timing"
    durability: durable
    input: { max_retries: 3 }
    output: { delays: ["1s", "2s", "4s"] }

