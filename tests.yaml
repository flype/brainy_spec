    durability: durable
    input: { content_type: "youtube" }
    output: { max_tokens_gte: 4000, max_tokens_lte: 8000 }

  - name: "boundary - social media summary max tokens is 1000"
    durability: durable
    input: { content_type: "twitter" }
    output: { max_tokens: 1000 }

  - name: "boundary - article summary max tokens is 2000-8000"
    durability: durable
