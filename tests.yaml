  - name: "boundary - high-score results included beyond 20 limit"
    durability: durable
    input: { search_results: "25 results all with score > 0.5" }
    output: { context_source_count: 25 }

  # DURABLE -- All intents require citation notation
  - name: "boundary - all non-command intents instruct citation [N] notation"
    durability: durable
    input: { intent: "any non-command intent" }
    output: { system_prompt_contains_citation_instruction: true }

  # EPHEMERAL -- Search strategy parameters
  - name: "example - navigational intent boosts lexical weight"
    durability: ephemeral
    input: { intent: "navigational" }
    output: { semantic_weight: 0.3, lexical_weight: 0.7 }

  - name: "example - comparative intent retrieves more results"
    durability: ephemeral
    input: { intent: "comparative" }
    output: { max_results: 25, max_tokens: 200000 }

  - name: "example - author-specific intent uses higher lexical weight"
    durability: ephemeral
    input: { intent: "author_specific" }
    output: { semantic_weight: 0.4, lexical_weight: 0.6, max_results: 30 }

  - name: "example - context includes user notes when present"
    durability: ephemeral
    input: { search_results: "result with user notes" }
    output: { context_contains: "User Notes:" }

  - name: "example - context includes metadata fields"
    durability: ephemeral
    input: { search_results: "youtube result with duration metadata" }
    output: { context_contains: "duration:" }

