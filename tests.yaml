    output: { context_contains: ["=== Source [1]", "=== Source [2]", "=== Source [3]"] }

  - name: "boundary - context template includes relevance scores"
    durability: durable
    input: { search_results: "results with scores" }
    output: { context_matches_pattern: "Relevance Score: \\d+\\.\\d+" }

  - name: "boundary - context template includes full content"
    durability: durable
    input: { search_results: "results with content" }
    output: { each_source_has_content_field: true, content_not_truncated: true }

  - name: "boundary - context template includes graph metadata when available"
