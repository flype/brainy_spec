    durability: ephemeral
    input: { question: "" }
    output: { submit_button_disabled: true, no_api_call: true }

  - name: "example - citations lazy-loaded via IntersectionObserver"
    durability: ephemeral
    input: { citations_count: 10, viewport_shows: 3 }
