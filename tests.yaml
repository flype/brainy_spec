# -- Paywall Detection --------------------------------------------------------
PaywallDetect:
  # DURABLE -- Known domains
  - name: "boundary - NYT is known paywall"
    durability: durable
    input: { url: "https://www.nytimes.com/article", html: "" }
    output: { detected: true, confidence_gte: 0.9 }

  - name: "boundary - WSJ is known paywall"
    durability: durable
    input: { url: "https://www.wsj.com/article", html: "" }
    output: { detected: true, confidence_gte: 0.9 }

  - name: "boundary - unknown domain not flagged by domain check"
    durability: durable
    input: { url: "https://example-blog.com/post", html: "<html><body><article>Full content here that is quite long and detailed</article></body></html>" }
    output: { detected: false }

  # DURABLE -- JSON-LD detection
  - name: "boundary - JSON-LD isAccessibleForFree false"
    durability: durable
    input: { url: "https://unknown.com", html: "<script type=\"application/ld+json\">{\"@type\":\"Article\",\"isAccessibleForFree\":false}</script>" }
    output: { detected: true, confidence: 1.0 }

  # EPHEMERAL -- HTML patterns
  - name: "example - paywall CSS class detected"
    durability: ephemeral
    input: { url: "https://unknown.com", html: "<div class=\"paywall-content\">Subscribe to read</div>" }
    output: { detected: true }

  - name: "example - Spanish paywall domain"
    durability: ephemeral
    input: { url: "https://elpais.com/article", html: "" }
    output: { detected: true }

# -- Upsert Bookmark ---------------------------------------------------------
UpsertBookmark:
  # DURABLE -- Upsert semantics
  - name: "boundary - new URL creates bookmark"
    durability: durable
    input: { url: "https://new.example.com", title: "New Article", content: "Article content" }
    output: { new_id: "valid-uuid" }

  - name: "boundary - existing URL updates in place"
    durability: durable
    input: { url: "https://existing.example.com", title: "Updated Title", content: "Updated content" }
    precondition: "bookmark with this URL exists with id=ABC"
    output: { id: "ABC", title: "Updated Title" }

  - name: "boundary - null URL always creates new row"
    durability: durable
    input: { url: null, content: "Note content 1" }
    output: { creates_new_row: true }

  - name: "boundary - second null URL creates another new row"
    durability: durable
    input: { url: null, content: "Note content 2" }
    precondition: "a bookmark with null URL already exists"
    output: { creates_new_row: true, different_id_from_existing: true }

# -- Hybrid Search ------------------------------------------------------------
HybridSearch:
  # DURABLE -- Score filtering
  - name: "boundary - results with score <= 0.01 are excluded"
    durability: durable
    input: { query_embedding: "valid_vector", query_text: "nonsense_query_unlikely_to_match", limit: 10 }
    output: { all_scores_gt: 0.01 }

  - name: "boundary - results ordered by combined score descending"
    durability: durable
    input: { query_embedding: "valid_vector", query_text: "common term", limit: 10 }
    output: { scores_descending: true }

  - name: "boundary - limit constrains result count"
    durability: durable
    input: { query_embedding: "valid_vector", query_text: "test", limit: 3 }
    output: { result_count_lte: 3 }

# -- Unified Hybrid Search ---------------------------------------------------
UnifiedHybridSearch:
  # DURABLE -- Deduplication
  - name: "boundary - no duplicate bookmark IDs in results"
