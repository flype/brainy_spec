# =============================================================================
# STATE MACHINE TRANSITIONS -- Job lifecycle (Section 8)
# =============================================================================
state_transitions:
  - name: "transition - pending to processing on worker pickup"
    machine: "job_lifecycle"
    from: "pending"
    trigger: "worker_pickup"
    to: "processing"
    profile: core

  - name: "transition - processing to completed on success"
    machine: "job_lifecycle"
    from: "processing"
    trigger: "processing_success"
    to: "completed"
    profile: core

  - name: "transition - processing to failed on non-retryable error"
    machine: "job_lifecycle"
    from: "processing"
    trigger: "non_retryable_error"
    to: "failed"
    profile: core

  - name: "transition - processing to failed on max retries exhausted"
    machine: "job_lifecycle"
    from: "processing"
    trigger: "max_retries_exhausted"
    to: "failed"
    profile: core

  - name: "invalid transition - completed cannot return to processing"
    machine: "job_lifecycle"
    from: "completed"
    trigger: "worker_pickup"
    error: true
    profile: core

  - name: "invalid transition - failed cannot return to processing"
    machine: "job_lifecycle"
    from: "failed"
    trigger: "worker_pickup"
    error: true
    profile: core

  - name: "invalid transition - completed cannot return to pending"
    machine: "job_lifecycle"
    from: "completed"
    trigger: "requeue"
    error: true
    profile: core

  - name: "invalid transition - processing cannot return to pending"
    machine: "job_lifecycle"
    from: "processing"
    trigger: "requeue"
    error: true
    profile: core

